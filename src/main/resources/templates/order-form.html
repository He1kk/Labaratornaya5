<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый заказ</title>
</head>
<body>
<h2>Оформление нового заказа деталей</h2>
<form th:action="@{/orders/new}" method="post">

    <label>Статус заказа:</label><br>
    <input type="text" name="status" placeholder="NEW / В обработке" required/><br><br>

    <label>Адрес доставки:</label><br>
    <input type="text" name="shippingAddress" placeholder="г. Белгород, ул. Победы" required/><br><br>

    <button type="submit">Добавить заказ</button>
</form>
<br>
<a th:href="@{/orders}">Назад к списку</a>
</body>
</html>
